<!DOCTYPE html>
<html lang="en"> 
<head> 

    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Interactive Webpage</title> 
    <link rel="stylesheet" href="style.css"> 
    
</head>

<body> 

    <h1 id="title">My Interactive Webpage</h1>

</body>
