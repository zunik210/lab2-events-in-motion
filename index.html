<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Before You React</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1 id="title">Think Before You React</h1>
    <p>Enter your name and interact with the page.</p>
    <input type="text" id="nameInput" placeholder="Enter your name">

    <button id="changeButton" onclick="clickFunction()">Click Me</button>

    <div id="hoverBox">Move your mouse over me!</div>

    <p id="reactionMessage">Your reaction will appear here.</p>

    <p id="keyMessage">Press any key on your keyboard.</p>

    <p id="clock">Time: Loading...</p>

    <h2>Action History</h2>
    <p id="history">No actions yet.</p>

    <script src="script.js"></script>

</body>

</html>
